name: Release
on:
  push:
    tags:
      - 'v*'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false # A restored cache is a poisoning vector in a publishing workflow
      - name: Install dependencies
        run: bundle install
      - name: Run tests
        run: bundle exec rake spec

  build: # Separate job so build-time dependencies can't publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version
          bundler-cache: false # Slower, but no cache poisoning risk
      - name: Build the gem
        run: mkdir -p pkg && gem build kometa.gemspec --output pkg/kometa.gem
      - name: Upload the built gem
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-gem
          path: pkg/kometa.gem
          retention-days: 1

  publish: # The critical job: no Gemfile, no bundler, one human approval
    runs-on: ubuntu-latest
    needs:
      - test
      - build
    environment: release # Required reviewers gate this job
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the built gem
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-gem
          path: pkg/
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ruby
          bundler-cache: false
      - name: Configure trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Sign the gem with sigstore
        run: gem exec sigstore-cli:0.2.3 sign pkg/kometa.gem --bundle pkg/kometa.sigstore.json
      - name: Push the gem
        run: gem push pkg/kometa.gem --attestation pkg/kometa.sigstore.json
